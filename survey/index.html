<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="robots" content="noindex, nofollow">
 <meta name="theme-color" content="#ffffff">
 <meta name="format-detection" content="telephone=no">
 <title>Chocolate Tasting Survey · 초콜릿 시식 설문</title>
 <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
 <link rel="stylesheet" href="/survey/survey.css?v=2026-11-v5">
</head>
<body class="sv">
 <main class="sv-main sv-langpage" id="sv-main">
  <section class="sv-lang" aria-labelledby="sv-lang-title">
   <p class="sv-eyebrow sv-lang__brand">JEONJU BURI</p>
   <h1 class="sv-h1" id="sv-lang-title">Chocolate Tasting Survey</h1>
   <p class="sv-lang__lead"><span lang="ko">설문에 사용할 언어를 선택해 주세요.</span><br><span lang="en">Please select your language.</span></p>
   <div class="sv-langs">
    <a class="sv-langcard" href="ko/" lang="ko" data-lang-link>
     <span class="sv-langcard__name">한국어</span>
     <span class="sv-langcard__action">한국어 설문 시작하기</span>
    </a>
    <a class="sv-langcard" href="en/" lang="en" data-lang-link>
     <span class="sv-langcard__name">English</span>
     <span class="sv-langcard__action">Start the survey in English</span>
    </a>
   </div>
  </section>
 </main>
 <script>
  // 조사 경로(source) 등 쿼리 파라미터를 언어별 설문으로 그대로 넘깁니다.
  (function () {
    var q = location.search;
    if (!q) return;
    var links = document.querySelectorAll('[data-lang-link]');
    for (var i = 0; i < links.length; i++) links[i].setAttribute('href', links[i].getAttribute('href') + q);
  })();
 </script>
</body>
</html>
